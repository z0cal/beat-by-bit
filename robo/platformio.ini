; Beat by Bit - tela do robo (ESP32-WROOM-32D + ST7789V 240x320 por SPI)
; Pinos (SPI por hardware, VSPI): SCK=18, MOSI=23, CS=5, DC=16, RST=17.
; LED/BL do modulo: ligar direto em 3V3 (nao em GPIO).

[env:esp32dev]
; Versao fixa: o TFT_eSPI 2.5.x ainda nao compila com o Arduino-ESP32 3.x
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DSPI_FREQUENCY=40000000
    ; Se as cores aparecerem invertidas ou trocadas, teste (um de cada vez):
    ;   -DTFT_INVERSION_ON=1     ou     -DTFT_RGB_ORDER=TFT_BGR
    ; Se a imagem sair de cabeca para baixo: -DROTATION=3

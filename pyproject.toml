[project]
name = "beat-by-bit-pc"
version = "0.1.0"
description = "Renderizador Pygame e geradores de chart do Beat by Bit (pasta pc/)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pygame>=2.6",
    "mido>=1.3",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
fpga = ["pyserial>=3.5"]
mapper = ["librosa>=0.10", "numpy", "soundfile", "matplotlib"]

[tool.uv]
package = false
